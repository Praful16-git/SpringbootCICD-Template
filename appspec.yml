version: 0.0
os: linux

files:
  - source: target/
    destination: /home/ec2-user/app

hooks:
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 300

  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300

  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
